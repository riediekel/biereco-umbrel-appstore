releaseNotes: >-
  Arcane 3.2.0 voegt project- en systeembackups toe (inclusief volumes),
  groeps-RBAC met per-bron-rechten en een opt-in modus voor auto-update en
  auto-heal. Ook bugfixes bij image-updates, GitOps-sync en
  permissiecontroles, en betere prestaties bij image-scans en paginaladingen.
  De manager houdt PUID/PGID op 0 voor compatibiliteit met projectmappen van 2.x.

  Arcane 3.1.0 is a major upgrade. The app now runs the renamed
  ghcr.io/getarcaneapp/manager image, every Arcane variable uses the ARCANE_
  prefix, and JWT_SECRET is gone.


  Back up the app data before updating. Because this device already ran 2.17.3,
  the database upgrade can proceed. Existing logins and projects migrate on
  startup, but notifications must be set up again under System -> Notifications,
  custom roles and API keys should be reviewed, and scripts using
  /api/environments must switch to /api/agents.


  Highlights: LDAP login with user sync, project copy and move between
  environments, and an adjustable background image blur.


  Full release notes can be found at https://github.com/getarcaneapp/arcane/releases/tag/v3.1.0
