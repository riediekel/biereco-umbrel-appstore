services:
  app_proxy:
    environment:
      APP_HOST: biereco_sabnzbd_web_1
      APP_PORT: 8080
      PROXY_AUTH_WHITELIST: "/api*"

  web:
    image: linuxserver/sabnzbd:5.1.3@sha256:7f173ced3541b46c57c4eb6854765243095c8c8a7563a878044fa0ccfb1f4004
    container_name: biereco_sabnzbd_web_1
    restart: on-failure
    stop_grace_period: 1m
    environment:
      - DOCKER_MODS=linuxserver/mods:universal-package-install
      - INSTALL_PACKAGES=ffmpeg
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Amsterdam
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${UMBREL_ROOT}/data/storage/downloads:/downloads
    networks:
      - default
      - arrstack

networks:
  # Umbrel's shared network. Declared explicitly because the top-level networks
  # block below stops umbrelOS from injecting it as the default network.
  default:
    name: umbrel_main_network
    external: true
  # Created once on the host (spotweb creates it), so every arr app shares it.
  # On a fresh device: docker network create --ipv6 arrstack
  arrstack:
    external: true
