manifestVersion: 1.1
id: biereco-sabnzbd
storage:
  dataRoot: data
category: networking
name: SABnzbd
version: "5.1.3"
icon: https://raw.githubusercontent.com/riediekel/biereco-umbrel-appstore/master/biereco-sabnzbd/icon.png
tagline: The automated Usenet download tool
description: >-
  SABnzbd makes Usenet as simple and streamlined as possible by automating everything we can. All you have to do is add an .nzb.
  SABnzbd takes over from there, where it will be automatically downloaded, verified, repaired, extracted and filed away with zero human interaction.
  SABnzbd offers an easy setup wizard and has self-analysis tools to verify your setup.


  This build runs on the shared Docker network `arrstack`, so Radarr, Sonarr, Lidarr and Prowlarr from this store can reach it at `http://biereco_sabnzbd_web_1:8080`.


  🛠️ SET-UP INSTRUCTIONS


  1. Open SABnzbd and follow the setup wizard to add your Usenet server.


  2. Find the API key under Settings → General; the other arr apps need it when you connect them.


  3. In the other apps, add SABnzbd as a download client with host `biereco_sabnzbd_web_1`, port `8080`, and that API key.


  4. Categories created in SABnzbd must match the categories in Radarr, Sonarr and Lidarr.
developer: sabnzbd
website: https://sabnzbd.org/
dependencies: []
repo: https://github.com/sabnzbd/sabnzbd
support: https://forums.sabnzbd.org/
port: 9876
gallery:
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/sabnzbd/1.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/sabnzbd/2.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/master/sabnzbd/3.jpg
path: ""
defaultUsername: ""
defaultPassword: ""
permissions:
  - STORAGE_DOWNLOADS
  - GPU
releaseNotes: >-
  New in this store, based on the official Umbrel package: SABnzbd 5.1.3 from
  the pinned linuxserver image, behind the Umbrel app proxy, with ffmpeg
  available for post-processing. Runs on the shared bridge network "arrstack"
  with IPv6, so the other arr apps reach it by container name.


  The network must exist on the device; spotweb creates it, or run
  `docker network create --ipv6 arrstack` once on a fresh install.
submitter: biereco
