services:
  app_proxy:
    environment:
      APP_HOST: biereco_spotweb_1
      APP_PORT: 8083
  spotweb:
    image: jgeusebroek/spotweb:20261021
#    network_mode: host
    container_name: biereco_spotweb_1
    restart: unless-stopped
    # Seed the Usenet server + admin credentials from the App Settings
    # environment variables before starting the upstream entrypoint.
    entrypoint: ["/bin/bash", "-c", "php /seed.php; exec /entrypoint.sh"]
    environment:
#      - PUID=1030
#      - GUID=100
      - TZ=Europe/Amsterdam
      - SPOTWEB_DB_TYPE=pdo_mysql
      - SPOTWEB_DB_HOST=spotweb_db
      - SPOTWEB_DB_PORT=3306
      - SPOTWEB_DB_NAME=spotweb
      - SPOTWEB_DB_USER=spotweb
      - SPOTWEB_DB_PASS=spotweb
      - SPOTWEB_CRON_RETRIEVE=* */2 * * *
    depends_on:
      spotweb_db:
        condition: service_healthy
    ports:
      - 8083:80
    volumes:
      - ${APP_DATA_DIR}/data/app_data/config:/config
      - ${APP_DATA_DIR}/hooks/seed.php:/seed.php:ro
      - ${APP_DATA_DIR}/hooks/theme.css:/var/www/spotweb/biereco-theme.css:ro
      - ${APP_DATA_DIR}/hooks/mobile.css:/var/www/spotweb/biereco-mobile.css:ro
      # Spotweb serves a separate jQuery-Mobile template to phones; override its
      # header to load the mobile theme.
      - ${APP_DATA_DIR}/hooks/mobile-header.inc.php:/var/www/spotweb/templates/mobile/header.inc.php:ro
      - ${APP_DATA_DIR}/hooks/mobile-basic-header.inc.php:/var/www/spotweb/templates/mobile/includes/basic-html-header.inc.php:ro

  spotweb_db:
    image: library/mariadb:13.0.2
    container_name: spotweb_db
    restart: unless-stopped
#    networks:
#      - intern
    environment:
      - PUID=1030
      - PGID=1000
      - MYSQL_ROOT_PASSWORD=spotweb
      - TZ=Europe/Amsterdam
      - MYSQL_DATABASE=spotweb
      - MYSQL_USER=spotweb
      - MYSQL_PASSWORD=spotweb
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data/db:/var/lib/mysql
#    ports:
#     - 3306:3306
